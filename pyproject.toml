[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hibob-advanced-mcp"
version = "0.1.0"
description = "MCP server for the HiBob Workforce Planning API (positions, openings, budgets)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.8.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
socks = ["httpx[socks]>=0.27.0"]
lint = ["ruff>=0.6"]
typecheck = ["mypy>=1.11", "pytest>=8.0.0", "respx>=0.21"]

[project.scripts]
hibob-advanced-mcp = "hibob_advanced_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hibob_advanced_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# -ra surfaces skips, so a silently skipped suite is visible in CI output.
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
# Match the package's minimum supported version, so no newer syntax slips in.
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures from conftest by name and assert on private details.
"tests/*" = ["E501"]

[tool.mypy]
# Deliberately non-strict: annotations are checked where they exist, but
# untyped code is allowed, so this catches real mistakes without demanding
# full coverage.
python_version = "3.10"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
