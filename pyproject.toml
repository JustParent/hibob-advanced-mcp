[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hibob-advanced-mcp"
version = "0.1.0"
description = "MCP server for the HiBob Workforce Planning API (positions, openings, budgets)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.8.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
socks = ["httpx[socks]>=0.27.0"]

[project.scripts]
hibob-advanced-mcp = "hibob_advanced_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hibob_advanced_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
